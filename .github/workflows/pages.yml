name: Publicar página de estado (GitHub Pages)

# OJO: agregar una rama acá NO basta para que se publique. El entorno `github-pages` del repo
# tiene una regla de protección que limita desde qué rama se despliega; desde cualquier otra la
# corrida arranca y falla en ~1 segundo en el paso de deploy (así fallaron las de
# `claude/revisar-contexto-plan-ttaumn` y `claude/array-agile-purchases-page-det2d4`). Para publicar
# un cambio de docs/, mergearlo a `main` — y tener `main` habilitada en
# Settings → Environments → github-pages.
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
