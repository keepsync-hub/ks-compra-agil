name: Publicar página de estado (GitHub Pages)

# OJO: agregar una rama acá NO basta para que se publique. El entorno `github-pages` del repo
# tiene una regla de protección que solo admite despliegues desde
# `claude/mercadopublico-agente-compras-pgyedf`; desde cualquier otra rama la corrida arranca y
# falla en ~1 segundo en el paso de deploy (así fallaron las de `claude/revisar-contexto-plan-ttaumn`
# y `claude/array-agile-purchases-page-det2d4`, que siguen listadas abajo). Para publicar un cambio
# de docs/, mergearlo a esa rama — o habilitar la nueva en Settings → Environments → github-pages.
on:
  push:
    branches:
      - claude/mercadopublico-agente-compras-pgyedf
      - claude/revisar-contexto-plan-ttaumn
      - claude/array-agile-purchases-page-det2d4
      - main
      - master
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
